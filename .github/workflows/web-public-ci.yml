name: Web Public CI
# Hosted verification marker: keep this workflow observable before branch protection.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'apps/public-web/**'
      - '.github/workflows/web-public-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/public-web/**'
      - '.github/workflows/web-public-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/public-web
        run: npm ci

      - name: Run ESLint
        working-directory: ./apps/public-web
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./apps/public-web
        run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/public-web
        run: npm ci

      - name: Build application
        working-directory: ./apps/public-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-web-build
          path: apps/public-web/.next
          retention-days: 7

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/public-web
        run: npm ci

      - name: Run npm audit
        working-directory: ./apps/public-web
        run: npm audit --audit-level=high
