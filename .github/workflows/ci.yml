name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests: one group per branch, superseded runs are cancelled. Pushes to main: one group per commit, so
# every merge gets its own result (GitHub keeps only one pending run per group).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'backend/Directory.Packages.props', 'backend/**/*.csproj', 'backend/**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore backend
      - name: Build
        run: dotnet build backend -warnaserror --no-restore
      - name: Test
        run: dotnet test --solution backend --no-build
      - name: Format
        run: dotnet format backend --verify-no-changes --no-restore

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @msp/e2e exec playwright install --with-deps chromium
      - name: Build apps and run smoke tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/e2e/playwright-report
          retention-days: 7

  # Generated files are committed so their diffs get reviewed; regenerate them all and fail if anything changed.
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'backend/Directory.Packages.props', 'backend/**/*.csproj', 'backend/**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Export error catalogue
        run: dotnet run --project backend/tools/SportsPlatform.Cli -- export-catalogues
      - name: Export OpenAPI document
        run: dotnet run --project backend/tools/SportsPlatform.Cli --no-build -- export-openapi
      - name: Generate TypeScript client
        working-directory: web
        run: pnpm --filter @msp/api-client generate
      - name: Fail if generated files are stale
        run: |
          git add --intent-to-add --all
          if ! git diff --exit-code --stat; then
            git diff
            echo "::error::Generated files are stale. Run the export-catalogues and export-openapi CLI commands and 'pnpm --filter @msp/api-client generate', then commit the result."
            exit 1
          fi

  infra:
    name: Local infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120
      - name: Check database roles
        run: infrastructure/local/postgres/check-roles.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
