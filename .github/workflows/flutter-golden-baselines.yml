name: Generate Flutter Linux Goldens

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.2'

jobs:
  generate-linux-goldens:
    name: Generate Linux Golden Baselines
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Verify Dart formatting
        working-directory: ./apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate Linux golden baselines
        working-directory: ./apps/mobile
        run: |
          mkdir -p test/goldens/linux
          flutter test test/public_home_golden_test.dart --update-goldens

      - name: Upload Linux golden baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-linux-goldens
          path: apps/mobile/test/goldens/linux/*.png
          if-no-files-found: error
          retention-days: 14
