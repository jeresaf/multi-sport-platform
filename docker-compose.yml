# Local development infrastructure. Copy .env.example to .env first (values are development-only).
#   docker compose up -d                                  PostgreSQL + Mailpit
#   docker compose --profile observability up -d          + Aspire dashboard for OpenTelemetry
#   docker compose down -v                                stop and delete local data
name: sportsplatform

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: postgres
      SP_DATABASE: sportsplatform
      SP_MIGRATOR_PASSWORD: ${SP_MIGRATOR_PASSWORD:?copy .env.example to .env}
      SP_APP_PASSWORD: ${SP_APP_PASSWORD:?copy .env.example to .env}
      SP_PLATFORM_PASSWORD: ${SP_PLATFORM_PASSWORD:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the check stays unhealthy while the init scripts run (the init server listens on the socket only).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sportsplatform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_UI_PORT:-18888}:18888"
      - "${OTLP_GRPC_PORT:-4317}:18889"
    restart: unless-stopped

volumes:
  pgdata:
