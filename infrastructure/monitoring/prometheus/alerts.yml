groups:
  - name: sportsplatform-critical
    interval: 15s
    rules:
      - alert: SportsPlatformApiDown
        expr: up{job="sportsplatform-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: SportsPlatform API metrics endpoint is unreachable
          description: Prometheus has been unable to scrape the API for one minute.
          runbook: docs/operations/monitoring.md#api-or-metrics-down

      - alert: SportsPlatformDatabaseUnhealthy
        expr: sportsplatform_dependency_health{dependency="postgresql"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: PostgreSQL health check is failing
          description: The API cannot reach its primary PostgreSQL dependency.
          runbook: docs/operations/monitoring.md#database-unhealthy

      - alert: SportsPlatformHighApiErrorRate
        expr: |
          sum(rate(sportsplatform_http_requests_total{status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(sportsplatform_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: API server-error rate exceeds five percent
          description: More than five percent of measured requests have returned 5xx for five minutes.
          runbook: docs/operations/monitoring.md#high-api-error-rate

      - alert: SportsPlatformNotificationFailures
        expr: sportsplatform_notification_failures{tenant_id="all"} > 0
        for: 5m
        labels:
          severity: critical
          service: notifications
        annotations:
          summary: Durable notification deliveries are failing
          description: One or more notifications remain in Failed state.
          runbook: docs/operations/monitoring.md#notification-failures

  - name: sportsplatform-warning
    interval: 30s
    rules:
      - alert: SportsPlatformRedisUnhealthy
        expr: sportsplatform_dependency_health{dependency="redis"} == 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: Optional Redis dependency is unavailable
          description: Core writes remain PostgreSQL-backed, but caching and scaling capacity are degraded.
          runbook: docs/operations/monitoring.md#redis-unhealthy

      - alert: SportsPlatformReportQueueBacklog
        expr: sportsplatform_queue_backlog{queue="reports",tenant_id="all"} > 100
        for: 10m
        labels:
          severity: warning
          service: reports
        annotations:
          summary: Report queue backlog exceeds 100 jobs
          description: Durable Pending/Processing report work has remained above the threshold.
          runbook: docs/operations/monitoring.md#queue-backlog

      - alert: SportsPlatformFailedJobs
        expr: sportsplatform_failed_jobs{queue="reports",tenant_id="all"} > 0
        for: 5m
        labels:
          severity: warning
          service: reports
        annotations:
          summary: One or more report jobs have failed
          description: Review the tenant breakdown before retrying safe jobs.
          runbook: docs/operations/monitoring.md#failed-jobs

      - alert: SportsPlatformMetricsMissing
        expr: absent(sportsplatform_api_up)
        for: 2m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: SportsPlatform application metrics are absent
          description: Prometheus is running but no application metric series is available.
          runbook: docs/operations/monitoring.md#api-or-metrics-down
