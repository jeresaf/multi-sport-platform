services:
  api:
    build:
      context: ../../../
      dockerfile: infrastructure/deployment/staging/Dockerfile.staging
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - Database__ConnectionString=Host=db;Port=5432;Database=sports_platform_staging;Username=postgres;Password=${DB_PASSWORD}
      - Database__RedisConnectionString=redis:6379
      - Tenant__DefaultConnectionString=Host=db;Port=5432;Database=sports_platform_staging;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__PreviousSecrets__0=${JWT_PREVIOUS_SECRET:-}
      - Jwt__Issuer=SportsPlatform
      - Jwt__Audience=SportsPlatformUsers
      - Jwt__AccessTokenExpirationMinutes=60
      - SeedData__EnableDemoData=true
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Warning
      - Storage__Endpoint=http://minio:9000
      - Storage__AccessKey=${MINIO_ROOT_USER:-sportsplatform}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD:-${DB_PASSWORD}}
      - Storage__Bucket=sports-platform
      - Email__Host=mailpit
      - Email__Port=1025
      - Email__UseTls=false
      - Email__FromAddress=no-reply@sportsplatform.local
      - Email__AdminWebBaseUrl=http://localhost:3000
      - Security__AllowedOrigins__0=http://localhost:3000
      - Security__AllowedOrigins__1=http://localhost:3001
      - Security__DataProtectionKeyPath=/app/data-protection-keys
    volumes:
      - data_protection_keys:/app/data-protection-keys
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - sports-platform-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-web:
    build:
      context: ../../../
      dockerfile: infrastructure/deployment/staging/Dockerfile.web
      args:
        APP_DIR: apps/admin-web
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sports-platform-staging
    restart: unless-stopped

  public-web:
    build:
      context: ../../../
      dockerfile: infrastructure/deployment/staging/Dockerfile.web
      args:
        APP_DIR: apps/public-web
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sports-platform-staging
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=sports_platform_staging
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          pg_dump -h db -U postgres -d sports_platform_staging -F c \
            -f "/backups/sports_platform_staging_$$(date -u +%Y%m%d_%H%M%S).dump"
          find /backups -type f -name '*.dump' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - postgres_staging_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports-platform-staging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - sports-platform-staging
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-sportsplatform}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${DB_PASSWORD}}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=5000
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_staging_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_staging_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_staging_data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-${DB_PASSWORD}}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "3002:3000"
    volumes:
      - ../../monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-staging
    restart: unless-stopped

  # Nginx reverse proxy for staging
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - sports-platform-staging
    restart: unless-stopped

volumes:
  postgres_staging_data:
  postgres_staging_backups:
  redis_staging_data:
  minio_staging_data:
  mailpit_staging_data:
  data_protection_keys:
  prometheus_staging_data:
  alertmanager_staging_data:
  grafana_staging_data:

networks:
  sports-platform-staging:
    driver: bridge
