name: sports_platform_mobile
description: Multi-Sport Platform Mobile Application - Supporter and Scorer modes
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.4.3+1
  signalr_netcore: ^1.4.4
  
  # Local Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.2.3
  
  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  share_plus: 10.0.0
  shimmer: ^3.0.0
  pull_to_refresh_flutter3: ^2.0.2
  
  # Forms and Validation
  reactive_forms: ^17.0.1
  file_picker: ^8.0.7
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  timezone: ^0.9.4
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.1
  
  # Platform specific
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  sqlite3: ^2.4.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
