services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__ConnectionString=Host=db;Port=5432;Database=sports_platform;Username=postgres;Password=${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      - Database__RedisConnectionString=redis:6379
      - Tenant__DefaultConnectionString=Host=db;Port=5432;Database=sports_platform;Username=postgres;Password=${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      - Jwt__Issuer=SportsPlatform
      - Jwt__Audience=SportsPlatformUsers
      - Jwt__AccessTokenExpirationMinutes=60
      - SeedData__EnableDemoData=true
      - Email__Host=mailpit
      - Email__Port=1025
      - Email__UseTls=false
      - Email__FromAddress=no-reply@sportsplatform.local
      - Email__AdminWebBaseUrl=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports-platform-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      - POSTGRES_DB=sports_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sports-platform-network
    restart: unless-stopped

  # Optional: Redis for caching/signalr backplane
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sports-platform-network
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sportsplatform.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Copy .env.example to .env and set PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - sports-platform-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sports-platform-network:
    driver: bridge
