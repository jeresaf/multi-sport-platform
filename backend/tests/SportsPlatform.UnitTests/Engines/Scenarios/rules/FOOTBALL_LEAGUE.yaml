# The FOOTBALL_LEAGUE template's values as docs/domain/rulesets.md shows them, until the resolver (S05-T4) resolves
# the template itself. Only the sections a contest plays by.
contest:
  period_seconds: { FIRST_HALF: 2700, HALF_TIME: 900, SECOND_HALF: 2700 }
  tie_resolution: DRAW
  extra_period_sequence: []
  coverage_default: STANDARD
lineup:
  starters: 11
  bench_max: 9
  requires_approval: false
  positions: { GK: { min: 1, max: 1 } }
substitutions: { max: 5, windows: 3, extra_in_extra_time: 1 }
operations:
  scorer_correction_window_minutes: 60
